# 目标位置 [m]，使用本地 ENU 坐标
target_x: 6.0
target_y: 0.0

# 避障外圈、内圈半径 [m]
R_outside: 1.6
R_inside: 0.9

# 目标追踪比例系数与速度限幅 [m/s]
p_xy: 0.7
vel_track_max: 0.30

# 外圈、内圈避障比例系数
p_R: 0.45
p_r: 1.5

# 避障速度与总速度限幅 [m/s]
vel_collision_max: 0.30
vel_sp_max: 0.30

# 雷达处理角度范围 [度]，对应 360 个 bin
range_min: 0
range_max: 359

# 三维点云切片：只取与机体同高（0 度平面）附近的点，超出这个高度带的不参与避障 [m]
z_band: 0.10
# 水平距离过滤：太近的点多为自机/地面噪声，太远的点不参与避障 [m]
min_obstacle_range: 0.15
max_obstacle_range: 8.0

# 1: 自动切换 OFFBOARD；0: 等待遥控器切换，与 hover/square 配置一致
if_debug: 1
